<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>media-hub</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <a href="#/" class="brand-name">media-hub</a>
        <span id="mode-badge" class="badge" hidden>Demo data</span>
      </div>
      <nav id="nav" aria-label="Pages"></nav>
      <div id="status" class="status" aria-live="polite"></div>
    </aside>
    <main id="main">
      <div id="banner"></div>
      <section id="view"></section>
    </main>
    <section id="player-panel" aria-label="Player">
      <div id="player-head" class="player-head"></div>
      <div id="player-box" class="player-box"></div>
      <div id="player-foot" class="player-foot"></div>
    </section>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <noscript>media-hub needs JavaScript.</noscript>
</body>
</html>
